              <rect x="46" y="15" width="3" height="3" rx="0.5" fill="var(--primary-glow-solid)" opacity="0.7"/>
              <rect x="42" y="23" width="3" height="3" rx="0.5" fill="var(--primary-glow-solid)" opacity="0.8"/>
              <rect x="46" y="23" width="3" height="3" rx="0.5" fill="var(--primary-glow-solid)" opacity="0.6"/>

          <h1 data-i18n="app.title">MBTI City Test</h1>
          <p class="subtitle" data-i18n="app.subtitle">Which city matches your MBTI?</p>
        </div>
        <div class="card" style="text-align:center">
          <p style="margin-bottom:16px;color:var(--text-muted)" data-i18n="app.startDesc">Answer 8 travel scenario questions to discover your MBTI city match!</p>
          <button id="start-btn" class="btn btn-primary" data-i18n="app.startBtn">Start Test</button>
        </div>
      </section>

      <section id="question-screen" class="screen">
        <div class="progress-container">
          <div class="skyline-progress">
            <svg id="skyline-svg" viewBox="0 0 200 80" fill="none" xmlns="http://www.w3.org/2000/svg">

              <rect class="building b2" x="27" y="30" width="16" height="50" rx="1" fill="var(--primary)" opacity="0.15"/>

              <rect class="building b7" x="130" y="15" width="22" height="65" rx="1" fill="var(--primary)" opacity="0.15"/>
              <rect class="building b8" x="156" y="30" width="18" height="50" rx="1" fill="var(--primary)" opacity="0.15"/>

            </svg>

          <div class="progress-text" id="progress-text">1 / 8</div>
        </div>
        <div id="question-container" class="card question-card">
